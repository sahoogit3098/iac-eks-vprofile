name: Vprofile-IAC-Terraform-Workflow-dev

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
      - feature/* # Trigger on pushes to feature branches  
    paths:
        - terraform/**  # Trigger only if files in the terraform directory are changed

  pull_request:
    branches:
      - main      # Trigger only on merge to main branches
    paths:
      - terraform/**  # Trigger only if files in the terraform directory are changed
  #workflow_dispatch:

env:
    # Define your cloud provider credentials as environment variables or secrets
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
    # S3 bucket for Terraform state
    TF_s3_bucket: ${{ secrets.BUCKET_TF_STATE }}
    AWS_REGION: ap-south-1
    EKS_CLUSTER_NAME: vprofile-eks

      
jobs:
  terraform_plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    environment: dev # Or your desired environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1 # Specify your desired Terraform version

      - name: Terraform Init
        id: init
        run: sterraform init -backend-config="bucket=${{ env.TF_s3_bucket }}" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="key=${{ env.EKS_CLUSTER_NAME }}/terraform.tfstate"
     
      - name: Terraform fmt Check
        id: fmt
        run: terraform fmt -check

      - name: Terraform fmt Diff
        id: fmt-diff
        run: terraform fmt -check -diff

      
      - name: Terraform Validate
        id: validate
        run: terraform validate
        
      - name: Terraform Plan -no-color -input=false -out=tfplan
        id: plan
        run: terraform plan
        continue-on-error: true

      - name: terraform plan status
        if: steps.plan.outcome == 'failure'
        run: echo "Terraform plan failed. Please check the configuration."

      - name: exit if failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
        
    
     